name: Deploy GPU Worker

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile.gpu"
      - "requirements.txt"
      - "requirements-gpu.txt"
      - "app/config.py"
      - "app/celery_app.py"
      - "app/core/dental_segmentation.py"
      - "app/core/model_inference.py"
      - "app/core/inference_health.py"
      - "app/tasks/inference.py"
      - "model_artifacts/dental_segmentation/**"
      - "orthoai_multimodel_best_model/**"
      - "Dockerfile.gpu.dockerignore"
      - ".github/workflows/deploy-gpu-worker.yml"
  workflow_dispatch:
    inputs:
      desired_count:
        description: "GPU worker desired count"
        required: true
        default: "1"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  GPU_ECR_REPOSITORY: medical-ai-production-celery-gpu
  ECS_CLUSTER: medical-ai-production-cluster
  GPU_SERVICE: medical-ai-production-celery-gpu-service
  GPU_CAPACITY_PROVIDER: orthoai-production-gpu-capacity
  GPU_SUBNET: subnet-0e1fe18240b9544fd
  ECS_SECURITY_GROUP: sg-07796e2d198063258
  INFERENCE_RUNNING_STALE_SECONDS: "900"

jobs:
  deploy:
    name: Build and Deploy GPU Celery Worker
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push GPU image
        env:
          GPU_IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.GPU_ECR_REPOSITORY }}:${{ github.sha }}
          GPU_LATEST_URI: ${{ steps.ecr.outputs.registry }}/${{ env.GPU_ECR_REPOSITORY }}:latest
        run: |
          docker build -f Dockerfile.gpu -t "$GPU_IMAGE_URI" -t "$GPU_LATEST_URI" .
          docker push "$GPU_IMAGE_URI"
          docker push "$GPU_LATEST_URI"

      - name: Register GPU celery task definition
        id: gpu-task
        env:
          GPU_IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.GPU_ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          aws ecs describe-task-definition \
            --task-definition medical-ai-production-celery \
            --query taskDefinition > current-celery.json

          jq \
            --arg image "$GPU_IMAGE_URI" \
            --arg build_commit "${{ github.sha }}" \
            --arg inference_running_stale "$INFERENCE_RUNNING_STALE_SECONDS" '
            def set_env($name; $value):
              .environment = ((.environment // []) | map(select(.name != $name)) + [{"name": $name, "value": $value}]);
            .family = "medical-ai-production-celery-gpu"
            | .requiresCompatibilities = ["EC2"]
            | .containerDefinitions |= map(
                if .name == "celery" then
                  .image = $image
                  | .command = ["celery", "-A", "app.celery_app", "worker", "-Q", "gpu-inference", "--loglevel=info", "--pool=solo", "--concurrency=1"]
                  | .resourceRequirements = [{"type": "GPU", "value": "1"}]
                  | set_env("ORTHOAI_DEVICE"; "cuda")
                  | set_env("PRELOAD_MODEL_RUNTIME"; "true")
                  | set_env("DENTAL_SEGMENTATION_ENABLED"; "true")
                  | set_env("DENTAL_SEGMENTATION_REQUIRED"; "true")
                  | set_env("ENVIRONMENT"; "production")
                  | set_env("INFERENCE_RUNNING_STALE_SECONDS"; $inference_running_stale)
                  | set_env("BUILD_COMMIT"; $build_commit)
                  | set_env("NVIDIA_DRIVER_CAPABILITIES"; "compute,utility")
                  | .logConfiguration = {
                      "logDriver": "awslogs",
                      "options": {
                        "awslogs-group": "/ecs/medical-ai-production-celery-gpu",
                        "awslogs-region": "eu-north-1",
                        "awslogs-stream-prefix": "ecs"
                      }
                    }
                else
                  .
                end
              )
            | {
                family,
                taskRoleArn,
                executionRoleArn,
                networkMode,
                containerDefinitions,
                volumes,
                placementConstraints,
                requiresCompatibilities,
                cpu,
                memory
              }
          ' current-celery.json > gpu-task-definition.json

          if ! jq -e '
            .containerDefinitions[]
            | select(.name == "celery")
            | (
                ((.environment // []) | any(.name == "ENVIRONMENT" and .value == "production"))
                and
                (
                  ((.environment // []) | any(.name == "REDIS_URL"))
                  or ((.secrets // []) | any(.name == "REDIS_URL"))
                )
              )
          ' gpu-task-definition.json > /dev/null; then
            echo "GPU task definition must contain ENVIRONMENT=production and REDIS_URL." >&2
            exit 1
          fi

          arn=$(aws ecs register-task-definition \
            --cli-input-json file://gpu-task-definition.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)

          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Create or update GPU ECS service
        id: gpu-service
        env:
          GPU_TASK_DEFINITION: ${{ steps.gpu-task.outputs.arn }}
          REQUESTED_DESIRED_COUNT: ${{ github.event.inputs.desired_count || '' }}
        run: |
          service_count=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$GPU_SERVICE" \
            --query 'length(services)' \
            --output text)

          current_desired_count=0
          if [ "$service_count" = "0" ]; then
            desired_count="${REQUESTED_DESIRED_COUNT:-1}"
          else
            current_desired_count=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$GPU_SERVICE" \
              --query 'services[0].desiredCount' \
              --output text)
            desired_count="${REQUESTED_DESIRED_COUNT:-$current_desired_count}"
          fi

          if ! [[ "$desired_count" =~ ^[0-9]+$ ]]; then
            echo "GPU desired count must be a non-negative integer." >&2
            exit 1
          fi

          # Ordinary pushes preserve the service's current desired count and
          # do not require extra Auto Scaling permissions. A deliberate manual
          # scale-up remains gated on proving the capacity provider can place
          # the requested number of GPU tasks.
          if [ -n "$REQUESTED_DESIRED_COUNT" ] && [ "$desired_count" -gt "$current_desired_count" ]; then
            asg_arn=$(aws ecs describe-capacity-providers \
              --capacity-providers "$GPU_CAPACITY_PROVIDER" \
              --query 'capacityProviders[0].autoScalingGroupProvider.autoScalingGroupArn' \
              --output text)
            if [ -z "$asg_arn" ] || [ "$asg_arn" = "None" ]; then
              echo "GPU capacity provider $GPU_CAPACITY_PROVIDER has no Auto Scaling group." >&2
              exit 1
            fi
            asg_name="${asg_arn##*/}"
            asg_max_size=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$asg_name" \
              --query 'AutoScalingGroups[0].MaxSize' \
              --output text)

            if ! [[ "$asg_max_size" =~ ^[0-9]+$ ]]; then
              echo "Could not resolve a valid max size for GPU ASG $asg_name." >&2
              exit 1
            fi

            if [ "$desired_count" -gt "$asg_max_size" ]; then
              echo "GPU ASG $asg_name max size $asg_max_size cannot place $desired_count worker task(s)." >&2
              exit 1
            fi
          fi

          if [ "$service_count" = "0" ]; then
            aws ecs create-service \
              --cluster "$ECS_CLUSTER" \
              --service-name "$GPU_SERVICE" \
              --task-definition "$GPU_TASK_DEFINITION" \
              --desired-count "$desired_count" \
              --deployment-configuration "minimumHealthyPercent=0,maximumPercent=200" \
              --capacity-provider-strategy "capacityProvider=$GPU_CAPACITY_PROVIDER,weight=1" \
              --network-configuration "awsvpcConfiguration={subnets=[$GPU_SUBNET],securityGroups=[$ECS_SECURITY_GROUP],assignPublicIp=DISABLED}"
          else
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$GPU_SERVICE" \
              --task-definition "$GPU_TASK_DEFINITION" \
              --desired-count "$desired_count" \
              --deployment-configuration "minimumHealthyPercent=0,maximumPercent=200" \
              --capacity-provider-strategy "capacityProvider=$GPU_CAPACITY_PROVIDER,weight=1"
          fi

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$GPU_SERVICE"

          echo "desired_count=$desired_count" >> "$GITHUB_OUTPUT"

      - name: Verify expected GPU heartbeat in Redis
        if: steps.gpu-service.outputs.desired_count != '0'
        env:
          EXPECTED_BUILD_COMMIT: ${{ github.sha }}
        run: |
          for attempt in {1..30}; do
            payload=$(curl --silent --show-error --max-time 10 \
              https://api.demo.orthoai.co/health/inference || true)
            if jq -e --arg expected "$EXPECTED_BUILD_COMMIT" '
              .status == "ready"
              and .worker.available == true
              and .worker.build_commit == $expected
            ' <<< "$payload" > /dev/null 2>&1; then
              echo "Expected GPU worker heartbeat is present in Redis."
              exit 0
            fi
            echo "Waiting for GPU worker heartbeat (attempt $attempt/30)..."
            sleep 20
          done

          echo "Expected GPU worker heartbeat was not observed; deployment is not ready." >&2
          exit 1
